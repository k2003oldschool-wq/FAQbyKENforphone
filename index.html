    <script>
        // --- 1. БАЗА ДАННЫХ И ИНИЦИАЛИЗАЦИЯ (INDEXED_DB) ---
        const defaultDB = {
            version: 2,
            items: [
                {
                    id: "comp-azerconnect", title: "Azerconnect", type: "company",
                    children: [
                        { id: "f-internet", title: "Интернет", type: "folder", children: [] }
                    ]
                }
            ]
        };

        let db = null; 
        let isEditMode = false;
        let currentNodeId = null;
        let currentSearchScopeId = null; 
        
        let editingNodeId = null; 
        let editingParentId = null; 
        let newNodeType = null;
        let savedCaretRange = null; 
        let searchTimeout = null;
        let activeHighlightQuery = null;
        let searchReturnState = null;
        let articleOpenedFromSearch = false;
        let matchNavigatorMatches = [];
        let activeMatchNavigatorIndex = 0;
        let isMatchNavigatorMinimized = false;

        function generateId() { return 'id-' + Math.random().toString(36).substr(2, 9); }

        // --- ИНТЕГРАЦИЯ INDEXED DB ---
        const DB_NAME = 'FAQ_Database';
        const STORE_NAME = 'faq_store';
        const DB_VERSION = 1;
        const MAIN_KEY = 'main_data';

        function openIDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const idb = e.target.result;
                    if (!idb.objectStoreNames.contains(STORE_NAME)) {
                        idb.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function saveToDB() {
            if (!db || !db.items) return;
            try {
                const idb = await openIDB();
                return new Promise((resolve, reject) => {
                    const tx = idb.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    store.put(db, MAIN_KEY);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            } catch (error) {
                console.error("Ошибка при сохранении данных (IndexedDB):", error);
                alert("Ошибка сохранения: не удалось безопасно записать данные в хранилище.");
            }
        }

        async function loadFromDB() {
            try {
                const idb = await openIDB();
                return new Promise((resolve, reject) => {
                    const tx = idb.transaction(STORE_NAME, 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.get(MAIN_KEY);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            } catch (error) {
                console.error("Ошибка при загрузке данных (IndexedDB):", error);
                return null;
            }
        }

        async function initStorage() {
            try {
                db = await loadFromDB();
                
                const oldLocal = localStorage.getItem('faq_database');
                if (oldLocal) {
                    try {
                        const parsedLocal = JSON.parse(oldLocal);
                        if (!db) {
                            db = parsedLocal;
                            await saveToDB(); 
                        }
                        localStorage.removeItem('faq_database');
                    } catch (e) {
                        console.error("Ошибка миграции:", e);
                    }
                }

                if (!db) {
                    db = defaultDB;
                    await saveToDB();
                }
                
                if (!db.version) db.version = 2;
                
                init(); 
            } catch (e) {
                console.error("Критическая ошибка инициализации базы:", e);
                alert("Критическая ошибка загрузки базы знаний. Пожалуйста, перезагрузите страницу.");
            }
        }

        // --- НОРМАЛИЗАЦИЯ ВСТАВЛЯЕМОГО HTML ---
        // Сохраняем семантическое форматирование, но не переносим layout-стили чужого сайта.
        const ALLOWED_RICH_TAGS = new Set([
            'A', 'B', 'BLOCKQUOTE', 'BR', 'CODE', 'DEL', 'DIV', 'EM', 'FIGCAPTION', 'FIGURE',
            'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'HR', 'I', 'IMG', 'LI', 'MARK', 'OL', 'P',
            'PRE', 'S', 'SECTION', 'SMALL', 'SPAN', 'STRONG', 'SUB', 'SUP', 'TABLE', 'TBODY',
            'TD', 'TFOOT', 'TH', 'THEAD', 'TR', 'U', 'UL'
        ]);
        const REMOVE_RICH_TAGS = new Set([
            'AUDIO', 'BASE', 'BUTTON', 'CANVAS', 'EMBED', 'FORM', 'FRAME', 'FRAMESET', 'IFRAME',
            'INPUT', 'LINK', 'META', 'NOSCRIPT', 'OBJECT', 'SCRIPT', 'SELECT', 'SOURCE', 'STYLE',
            'SVG', 'TEXTAREA', 'VIDEO'
        ]);
        const ALLOWED_RICH_STYLES = new Set([
            'background-color', 'border', 'border-bottom', 'border-collapse', 'border-color',
            'border-left', 'border-right', 'border-spacing', 'border-style', 'border-top',
            'border-width', 'color', 'font-style', 'font-weight', 'list-style-type', 'text-align',
            'text-decoration', 'text-decoration-line', 'text-decoration-style', 'vertical-align'
        ]);

        function unwrapElement(element) {
            const parent = element.parentNode;
            if (!parent) return;
            while (element.firstChild) parent.insertBefore(element.firstChild, element);
            element.remove();
        }

        function isAppImageWrapper(element) {
            return element.tagName === 'DIV' && element.classList.contains('image-container') &&
                Array.from(element.children).some(child => child.tagName === 'IMG');
        }

        function isUsableImageSource(src) {
            const value = (src || '').trim();
            return /^https?:\/\//i.test(value) ||
                /^data:image\/(?:avif|gif|jpe?g|png|svg\+xml|webp)(?:;|,)/i.test(value);
        }

        function isSafeLinkHref(href) {
            const value = (href || '').trim();
            return value.startsWith('#') || /^(https?:|mailto:|tel:)/i.test(value);
        }

        function hasTrackingDimensions(image) {
            const attrWidth = parseFloat(image.getAttribute('width'));
            const attrHeight = parseFloat(image.getAttribute('height'));
            const styleWidth = parseFloat(image.style.width);
            const styleHeight = parseFloat(image.style.height);
            return [attrWidth, attrHeight, styleWidth, styleHeight].some(value => !Number.isNaN(value) && value <= 1);
        }

        function getSafeInlineStyles(element, keepImageAlignment) {
            const safeStyles = [];
            Array.from(element.style).forEach(property => {
                const value = element.style.getPropertyValue(property).trim();
                if (!value) return;
                if (ALLOWED_RICH_STYLES.has(property)) {
                    safeStyles.push([property, value, element.style.getPropertyPriority(property)]);
                }
                if (keepImageAlignment && property === 'float' && ['left', 'right', 'none'].includes(value)) {
                    safeStyles.push([property, value, '']);
                }
                if (keepImageAlignment && property === 'margin' && /^(?:-?\d+(?:\.\d+)?(?:px|rem|em|%)|auto)(?:\s+(?:-?\d+(?:\.\d+)?(?:px|rem|em|%)|auto)){0,3}$/.test(value)) {
                    safeStyles.push([property, value, '']);
                }
                if (element.tagName === 'IMG' && ['width', 'height'].includes(property)) {
                    safeStyles.push([property, value, '']);
                }
            });
            return safeStyles;
        }

        function sanitizeElementAttributes(element) {
            const tagName = element.tagName;
            const isImageWrapper = isAppImageWrapper(element);
            const src = element.getAttribute('src');
            const href = element.getAttribute('href');
            const alt = element.getAttribute('alt');
            const title = element.getAttribute('title');
            const target = element.getAttribute('target');
            const safeStyles = getSafeInlineStyles(element, isImageWrapper);
            const tableAttributes = {
                border: element.getAttribute('border'),
                cellpadding: element.getAttribute('cellpadding'),
                cellspacing: element.getAttribute('cellspacing'),
                colspan: element.getAttribute('colspan'),
                rowspan: element.getAttribute('rowspan'),
                scope: element.getAttribute('scope'),
                start: element.getAttribute('start'),
                type: element.getAttribute('type'),
                value: element.getAttribute('value')
            };

            Array.from(element.attributes).forEach(attribute => element.removeAttribute(attribute.name));
            safeStyles.forEach(([property, value, priority]) => element.style.setProperty(property, value, priority));

            if (isImageWrapper) element.className = 'image-container';
            if (title) element.setAttribute('title', title);

            if (tagName === 'A' && isSafeLinkHref(href)) {
                element.setAttribute('href', href.trim());
                if (target === '_blank') {
                    element.setAttribute('target', '_blank');
                    element.setAttribute('rel', 'noopener noreferrer');
                }
            }
            if (tagName === 'IMG') {
                element.setAttribute('src', src.trim());
                if (alt) element.setAttribute('alt', alt);
            }
            if (tagName === 'TABLE') {
                ['border', 'cellpadding', 'cellspacing'].forEach(name => {
                    if (tableAttributes[name]) element.setAttribute(name, tableAttributes[name]);
                });
            }
            if (['TD', 'TH'].includes(tagName)) {
                ['colspan', 'rowspan', 'scope'].forEach(name => {
                    if (tableAttributes[name]) element.setAttribute(name, tableAttributes[name]);
                });
            }
            if (tagName === 'OL' && tableAttributes.start) element.setAttribute('start', tableAttributes.start);
            if (['OL', 'UL', 'LI'].includes(tagName) && tableAttributes.type) element.setAttribute('type', tableAttributes.type);
            if (tagName === 'LI' && tableAttributes.value) element.setAttribute('value', tableAttributes.value);
        }

        function sanitizeRichContent(root) {
            Array.from(root.querySelectorAll('*')).forEach(element => {
                if (REMOVE_RICH_TAGS.has(element.tagName)) element.remove();
            });

            Array.from(root.querySelectorAll('*')).forEach(element => {
                if (!root.contains(element)) return;
                if (!ALLOWED_RICH_TAGS.has(element.tagName)) unwrapElement(element);
            });

            Array.from(root.querySelectorAll('*')).forEach(element => {
                if (!root.contains(element)) return;
                if (element.tagName === 'IMG') {
                    const hidden = element.hasAttribute('hidden') || element.getAttribute('aria-hidden') === 'true' ||
                        /(?:display\s*:\s*none|visibility\s*:\s*hidden|opacity\s*:\s*0)/i.test(element.getAttribute('style') || '');
                    if (!isUsableImageSource(element.getAttribute('src')) || hasTrackingDimensions(element) || hidden) {
                        element.remove();
                        return;
                    }
                }
                sanitizeElementAttributes(element);
            });
        }

        function removeBrokenImage(image) {
            const wrapper = image.closest('.image-container');
            if (wrapper && wrapper.querySelectorAll('img').length === 1) wrapper.remove();
            else image.remove();
        }

        function bindImageErrorHandlers(root) {
            root.querySelectorAll('img').forEach(image => {
                if (!isUsableImageSource(image.getAttribute('src'))) {
                    removeBrokenImage(image);
                    return;
                }
                image.addEventListener('error', () => removeBrokenImage(image), { once: true });
                if (image.complete && image.naturalWidth === 0) removeBrokenImage(image);
            });
        }

        function normalizeImageContainers(root) {
            root.querySelectorAll('img').forEach(img => {
                const wrapper = img.closest('.image-container');
                if (!wrapper) {
                    const newWrapper = document.createElement('div');
                    newWrapper.className = 'image-container';
                    newWrapper.setAttribute('contenteditable', 'false');

                    let f = 'none', m = '15px auto';
                    if (img.style.float === 'left') { f = 'left'; m = '10px 20px 10px 0'; }
                    else if (img.style.float === 'right') { f = 'right'; m = '10px 0 10px 20px'; }

                    newWrapper.style.float = f;
                    newWrapper.style.margin = m;
                    newWrapper.style.display = 'block';
                    newWrapper.style.width = 'fit-content';

                    img.style.float = 'none';
                    img.style.margin = '0';
                    img.style.display = 'block';

                    img.parentNode.insertBefore(newWrapper, img);
                    newWrapper.appendChild(img);
                } else {
                    wrapper.setAttribute('contenteditable', 'false');
                    wrapper.style.width = 'fit-content';
                    if (wrapper.style.display === 'flex' || wrapper.style.width === '100%') {
                        const jc = wrapper.style.justifyContent;
                        wrapper.style.display = 'block';
                        if (jc === 'flex-start') { wrapper.style.float = 'left'; wrapper.style.margin = '10px 20px 10px 0'; }
                        else if (jc === 'flex-end') { wrapper.style.float = 'right'; wrapper.style.margin = '10px 0 10px 20px'; }
                        else { wrapper.style.float = 'none'; wrapper.style.margin = '15px auto'; }
                        wrapper.style.justifyContent = '';
                    }
                }
            });
        }

        function plainTextToHtml(text) {
            const temp = document.createElement('div');
            temp.textContent = text || '';
            return temp.innerHTML.replace(/\r?\n/g, '<br>');
        }

        function migrateContent(html) {
            if (!html) return '';
            const temp = document.createElement('div');
            temp.innerHTML = html;
            sanitizeRichContent(temp);
            normalizeImageContainers(temp);
            return temp.innerHTML;
        }

        function handleEditorPaste(event) {
            const clipboard = event.clipboardData;
            if (!clipboard) return;
            const html = clipboard.getData('text/html');
            const plainText = clipboard.getData('text/plain');
            if (!html && !plainText) return;

            event.preventDefault();
            let safeHtml = html ? migrateContent(html) : '';
            if (!safeHtml.trim() && plainText) safeHtml = plainTextToHtml(plainText);
            if (!safeHtml) return;

            document.execCommand('insertHTML', false, safeHtml);
            const editorBody = document.getElementById('edit-body');
            bindImageErrorHandlers(editorBody);
            hideImageControls();
        }

        function init() {
            renderSidebarTree();
            goHome();
            const editorBody = document.getElementById('edit-body');
            editorBody.addEventListener('blur', () => {
                const sel = window.getSelection();
                if (sel.rangeCount > 0) savedCaretRange = sel.getRangeAt(0);
            });
            editorBody.addEventListener('scroll', updateImageOverlay);
            editorBody.addEventListener('paste', handleEditorPaste);
        }

        // --- ФОРМАТИРОВАНИЕ И ОБНОВЛЕНИЕ ДАТЫ ---
        function formatLastModified(timestamp) {
            if (!timestamp) return "Ещё не изменялась";
            const d = new Date(timestamp);
            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const yyyy = d.getFullYear();
            const hh = String(d.getHours()).padStart(2, '0');
            const min = String(d.getMinutes()).padStart(2, '0');
            return `Изменено: ${dd}.${mm}.${yyyy}, ${hh}:${min}`;
        }

        // Рекурсивно ищет узел и попутно обновляет дату всем его предкам вплоть до корня
        function updateAncestorsTimestamp(nodes, targetId, timestamp) {
            for (let node of nodes) {
                if (node.id === targetId) {
                    node.lastModified = timestamp;
                    return true;
                }
                if (node.children) {
                    const found = updateAncestorsTimestamp(node.children, targetId, timestamp);
                    if (found) {
                        node.lastModified = timestamp;
                        return true;
                    }
                }
            }
            return false;
        }

        // --- УПРАВЛЕНИЕ МОБИЛЬНЫМ САЙДБАРОМ ---
        function toggleSidebar(forceState) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const isOpen = sidebar.classList.contains('open');
            const newState = typeof forceState === 'boolean' ? forceState : !isOpen;
            
            if (newState) {
                sidebar.classList.add('open');
                overlay.classList.add('active');
            } else {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            }
        }

        // --- БЕЗОПАСНАЯ ПОДСВЕТКА И ОЧИСТКА В СТАТЬЯХ ---
        
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        const TEMP_HIGHLIGHT_BLOCKS = new Set([
            'ADDRESS', 'ARTICLE', 'ASIDE', 'BLOCKQUOTE', 'DD', 'DIV', 'DL', 'DT',
            'FIGCAPTION', 'FIGURE', 'FOOTER', 'HEADER', 'H1', 'H2', 'H3', 'H4',
            'H5', 'H6', 'LI', 'MAIN', 'NAV', 'P', 'PRE', 'SECTION', 'TABLE',
            'TBODY', 'TD', 'TFOOT', 'TH', 'THEAD', 'TR', 'UL', 'OL'
        ]);
        const TEMP_HIGHLIGHT_SKIPPED_TAGS = new Set(['SCRIPT', 'STYLE', 'NOSCRIPT', 'TEMPLATE']);

        function getSearchTokens(query) {
            const rawQuery = String(query ?? '');
            const parts = rawQuery.includes(',') ? rawQuery.split(',') : [rawQuery];
            const seen = new Set();

            return parts.reduce((tokens, part) => {
                const token = part.normalize('NFC').trim().replace(/\s+/g, ' ');
                const key = token.toLowerCase();
                if (token && !seen.has(key)) {
                    seen.add(key);
                    tokens.push(token);
                }
                return tokens;
            }, []);
        }

        function getSearchTermPattern(term) {
            return escapeRegExp(term.normalize('NFC').toLowerCase()).replace(/ /g, '\\s+');
        }

        function createSearchTermRegex(term, flags) {
            const pattern = getSearchTermPattern(term);
            return new RegExp(
                `(?<!\\p{L})${pattern}`,
                flags
            );
        }

        function getHighlightTextMap(root, includeContextHighlights = false) {
            const entries = [];
            let text = '';
            const hardBreakOffsets = new Set();
            let pendingHardBreak = false;
            let previousBlockPath = [];
            const walker = document.createTreeWalker(
                root,
                NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT
            );

            function isIgnoredElement(element) {
                return TEMP_HIGHLIGHT_SKIPPED_TAGS.has(element.tagName) ||
                    element.matches('mark.temp-highlight') ||
                    (!includeContextHighlights &&
                        element.matches('span.context-highlight[data-temp-context="1"]'));
            }

            function getBlockPath(node) {
                const blocks = [];
                let current = node.parentElement;
                while (current && current !== root) {
                    if (TEMP_HIGHLIGHT_BLOCKS.has(current.tagName)) blocks.push(current);
                    current = current.parentElement;
                }
                return blocks.reverse();
            }

            function hasSameBlockPath(left, right) {
                return left.length === right.length &&
                    left.every((element, index) => element === right[index]);
            }

            let current;
            while ((current = walker.nextNode())) {
                if (current.nodeType === Node.ELEMENT_NODE) {
                    if (isIgnoredElement(current)) continue;
                    if (current.tagName === 'BR' || TEMP_HIGHLIGHT_BLOCKS.has(current.tagName)) {
                        pendingHardBreak = true;
                    }
                    continue;
                }

                const value = current.nodeValue || '';
                if (!value || current.parentElement?.closest(
                    'mark.temp-highlight, script, style, noscript, template' +
                    (includeContextHighlights ? '' : ', span.context-highlight[data-temp-context="1"]')
                )) continue;

                const blockPath = getBlockPath(current);
                if (entries.length > 0 &&
                    (pendingHardBreak || !hasSameBlockPath(previousBlockPath, blockPath))) {
                    hardBreakOffsets.add(text.length);
                }

                entries.push({ node: current, start: text.length, end: text.length + value.length });
                text += value;
                previousBlockPath = blockPath;
                pendingHardBreak = false;
            }

            return {
                text,
                entries,
                hardBreakOffsets: [...hardBreakOffsets]
                    .filter(offset => offset > 0 && offset < text.length)
                    .sort((left, right) => left - right)
            };
        }

        function getGraphemeSegments(value) {
            if (typeof Intl !== 'undefined' && Intl.Segmenter) {
                return [...new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(value)]
                    .map(({ segment, index }) => ({ segment, index }));
            }

            const segments = [];
            let index = 0;
            for (const character of value) {
                if (segments.length > 0 && /\p{M}/u.test(character)) {
                    segments[segments.length - 1].segment += character;
                } else {
                    segments.push({ segment: character, index });
                }
                index += character.length;
            }
            return segments;
        }

        function getNormalizedSearchTextMap(entries) {
            let text = '';
            const offsets = [];

            entries.forEach(entry => {
                getGraphemeSegments(entry.node.nodeValue || '').forEach(({ segment, index }) => {
                    const normalized = segment.normalize('NFC').toLowerCase();
                    const start = entry.start + index;
                    const end = start + segment.length;
                    text += normalized;
                    for (let offset = 0; offset < normalized.length; offset += 1) {
                        offsets.push({ start, end });
                    }
                });
            });

            return { text, offsets };
        }

        function rangeCrossesHardBreak(start, end, hardBreakOffsets) {
            return hardBreakOffsets.some(offset => offset > start && offset < end);
        }

        function getTokenMatches(searchTextMap, tokens, hardBreakOffsets = []) {
            const matches = [];

            tokens.forEach((token, tokenIndex) => {
                const regex = createSearchTermRegex(token, 'giu');
                let match;

                while ((match = regex.exec(searchTextMap.text)) !== null) {
                    const normalizedStart = match.index;
                    const normalizedEnd = normalizedStart + match[0].length;
                    const start = searchTextMap.offsets[normalizedStart].start;
                    const end = searchTextMap.offsets[normalizedEnd - 1].end;
                    if (!rangeCrossesHardBreak(start, end, hardBreakOffsets)) {
                        matches.push({ start, end, tokenIndex });
                    }
                }
            });

            return matches;
        }

        function getSentenceEndIndex(text, index, rangeEnd) {
            if (!/[.!?]/.test(text[index])) return null;

            let sentenceEnd = index + 1;
            while (sentenceEnd < rangeEnd && /[.!?]/.test(text[sentenceEnd])) sentenceEnd += 1;
            while (sentenceEnd < rangeEnd && /["'»”’)\]}]/.test(text[sentenceEnd])) sentenceEnd += 1;

            return sentenceEnd === rangeEnd || /\s/.test(text[sentenceEnd])
                ? sentenceEnd
                : null;
        }

        function skipSentenceWhitespace(text, start, end) {
            let index = start;
            while (index < end && /\s/.test(text[index])) index += 1;
            return index;
        }

        function addSentenceRanges(text, start, end, ranges) {
            let sentenceStart = skipSentenceWhitespace(text, start, end);
            let index = sentenceStart;

            while (index < end) {
                const sentenceEnd = getSentenceEndIndex(text, index, end);
                if (!sentenceEnd) {
                    index += 1;
                    continue;
                }

                if (sentenceStart < sentenceEnd) {
                    ranges.push({ start: sentenceStart, end: sentenceEnd });
                }
                sentenceStart = skipSentenceWhitespace(text, sentenceEnd, end);
                index = sentenceStart;
            }

            let lastSentenceEnd = end;
            while (lastSentenceEnd > sentenceStart && /\s/.test(text[lastSentenceEnd - 1])) {
                lastSentenceEnd -= 1;
            }
            if (sentenceStart < lastSentenceEnd) {
                ranges.push({ start: sentenceStart, end: lastSentenceEnd });
            }
        }

        function getSentenceRanges(text, hardBreakOffsets = []) {
            const ranges = [];
            let blockStart = 0;
            const blockEnds = [...hardBreakOffsets, text.length];

            for (const blockEnd of blockEnds) {
                addSentenceRanges(text, blockStart, blockEnd, ranges);
                blockStart = blockEnd;
            }

            return ranges;
        }

        function getContextHighlightLevel(uniqueTokenCount, totalTokenCount) {
            if (uniqueTokenCount === totalTokenCount) return 'maximum';
            return uniqueTokenCount >= 3 ? 'medium' : 'light';
        }

        // Единый профиль используется для подсветки, сортировки и автоскролла.
        // Повторы одного термина увеличивают totalMatches, но не uniqueTokenCount.
        function getRelevanceProfile(root, query) {
            const tokens = getSearchTokens(query);
            const emptyProfile = {
                tokens,
                text: '',
                entries: [],
                matches: [],
                contextRanges: [],
                bestContext: null,
                rankingProfile: [],
                profileVector: [],
                totalMatches: 0
            };

            if (!root || tokens.length === 0) return emptyProfile;

            const { text, entries, hardBreakOffsets } = getHighlightTextMap(root);
            const searchTextMap = getNormalizedSearchTextMap(entries);
            const matches = getTokenMatches(searchTextMap, tokens, hardBreakOffsets);
            const contextRanges = [];
            let nextContextId = 1;
            let bestContext = null;

            getSentenceRanges(text, hardBreakOffsets).forEach(sentence => {
                const foundTokenIndexes = new Set();

                matches.forEach(match => {
                    if (match.start >= sentence.start && match.end <= sentence.end) {
                        foundTokenIndexes.add(match.tokenIndex);
                    }
                });

                const uniqueTokenCount = foundTokenIndexes.size;
                if (uniqueTokenCount < 2) return;

                const contextRange = {
                    start: sentence.start,
                    end: sentence.end,
                    id: nextContextId,
                    count: uniqueTokenCount,
                    level: getContextHighlightLevel(uniqueTokenCount, tokens.length),
                    tokenIndexes: [...foundTokenIndexes]
                };
                nextContextId += 1;
                contextRanges.push(contextRange);

                if (!bestContext || contextRange.count > bestContext.count) {
                    bestContext = contextRange;
                }
            });

            const rankingProfile = [];
            for (let uniqueCount = tokens.length; uniqueCount >= 2; uniqueCount -= 1) {
                rankingProfile.push(
                    contextRanges.filter(range => range.count === uniqueCount).length
                );
            }

            return {
                tokens,
                text,
                entries,
                matches,
                contextRanges,
                bestContext,
                rankingProfile,
                profileVector: [...rankingProfile, matches.length],
                totalMatches: matches.length
            };
        }

        function getArticleRelevanceProfile(content, query) {
            const root = document.createElement('div');
            root.innerHTML = migrateContent(content || '');
            return getRelevanceProfile(root, query);
        }

        function mergeHighlightRanges(matches) {
            const ranges = [];

            matches
                .map(({ start, end }) => ({ start, end }))
                .sort((left, right) => left.start - right.start || right.end - left.end)
                .forEach(range => {
                    const previous = ranges[ranges.length - 1];
                    if (previous && range.start < previous.end) {
                        previous.end = Math.max(previous.end, range.end);
                    } else {
                        ranges.push(range);
                    }
                });

            return ranges;
        }

        function addRangeBoundaries(boundaries, entry, ranges) {
            ranges.forEach(range => {
                const start = Math.max(range.start, entry.start);
                const end = Math.min(range.end, entry.end);

                if (start < end) {
                    boundaries.add(start - entry.start);
                    boundaries.add(end - entry.start);
                }
            });
        }

        function renderTemporaryHighlights(entries, highlightRanges) {
            entries.forEach(entry => {
                const boundaries = new Set([0, entry.node.nodeValue.length]);
                addRangeBoundaries(boundaries, entry, highlightRanges);
                const points = [...boundaries].sort((left, right) => left - right);
                const fragment = document.createDocumentFragment();

                for (let index = 0; index < points.length - 1; index += 1) {
                    const from = points[index];
                    const to = points[index + 1];
                    // entry.start/end and all ranges use the same physical text offsets.
                    const globalStart = entry.start + from;
                    const globalEnd = entry.start + to;
                    let piece = document.createTextNode(entry.node.nodeValue.slice(from, to));

                    if (findContainingRange(highlightRanges, globalStart, globalEnd)) {
                        const mark = document.createElement('mark');
                        mark.className = 'temp-highlight';
                        mark.appendChild(piece);
                        piece = mark;
                    }

                    fragment.appendChild(piece);
                }

                entry.node.parentNode.replaceChild(fragment, entry.node);
            });
        }

        function findContainingRange(ranges, start, end) {
            return ranges.find(range => range.start <= start && range.end >= end);
        }

        function findTextBoundary(entries, offset, isStart) {
            const entry = entries.find(candidate => {
                if (isStart) {
                    return offset >= candidate.start && offset < candidate.end;
                }
                return offset > candidate.start && offset <= candidate.end;
            });

            if (!entry) return null;
            return { node: entry.node, offset: offset - entry.start };
        }

        function createContextDomRange(entries, contextRange) {
            const start = findTextBoundary(entries, contextRange.start, true);
            const end = findTextBoundary(entries, contextRange.end, false);
            if (!start || !end) return null;

            const range = document.createRange();
            range.setStart(start.node, start.offset);
            range.setEnd(end.node, end.offset);
            return range.collapsed ? null : range;
        }

        function renderContextHighlights(entries, contextRanges) {
            return contextRanges
                .map(contextRange => ({
                    contextRange,
                    domRange: createContextDomRange(entries, contextRange)
                }))
                .filter(item => item.domRange)
                .sort((left, right) => right.contextRange.start - left.contextRange.start)
                .map(({ contextRange, domRange }) => {
                    const context = document.createElement('span');
                    context.className = 'context-highlight';
                    context.dataset.tempContext = '1';
                    context.dataset.tempContextId = String(contextRange.id);
                    context.dataset.tempContextCount = String(contextRange.count);
                    context.dataset.tempContextLevel = contextRange.level;
                    context.appendChild(domRange.extractContents());
                    domRange.insertNode(context);
                    return context;
                });
        }

        function applyTemporaryHighlight(element, query) {
            if (!element) return null;

            clearTemporaryHighlights(element);

            const profile = getRelevanceProfile(element, query);
            if (profile.matches.length === 0) return null;

            renderContextHighlights(profile.entries, profile.contextRanges);

            const highlightedMap = getHighlightTextMap(element, true);
            renderTemporaryHighlights(
                highlightedMap.entries,
                mergeHighlightRanges(profile.matches)
            );

            setupMatchNavigator(element, profile);

            if (profile.bestContext) {
                return element.querySelector(
                    `span.context-highlight[data-temp-context-id="${profile.bestContext.id}"]`
                );
            }
            return element.querySelector('mark.temp-highlight');
        }

        function getContextTokens(profile, contextRange) {
            return contextRange.tokenIndexes.map(index => profile.tokens[index]);
        }

        function hideMatchNavigator() {
            document.querySelectorAll('.active-match-sentence').forEach(element => {
                element.classList.remove('active-match-sentence');
            });
            matchNavigatorMatches = [];
            activeMatchNavigatorIndex = 0;
            document.getElementById('match-navigator').classList.add('hidden');
            document.getElementById('match-navigator-minimized').classList.add('hidden');
        }

        function setupMatchNavigator(root, profile) {
            matchNavigatorMatches = profile.contextRanges
                .map(contextRange => ({
                    ...contextRange,
                    totalTokenCount: profile.tokens.length,
                    tokens: getContextTokens(profile, contextRange),
                    elements: [...root.querySelectorAll(
                        `span.context-highlight[data-temp-context-id="${contextRange.id}"]`
                    )]
                }))
                .filter(match => match.elements.length > 0)
                .sort((left, right) => right.count - left.count || left.id - right.id);

            activeMatchNavigatorIndex = 0;
            if (matchNavigatorMatches.length === 0) {
                hideMatchNavigator();
                return;
            }

            updateMatchNavigator(false);
        }

        function updateMatchNavigator(shouldScroll) {
            const match = matchNavigatorMatches[activeMatchNavigatorIndex];
            if (!match) {
                hideMatchNavigator();
                return;
            }

            document.querySelectorAll('.active-match-sentence').forEach(element => {
                element.classList.remove('active-match-sentence');
            });
            match.elements.forEach(element => element.classList.add('active-match-sentence'));

            document.getElementById('match-navigator-position').textContent =
                `Предложение ${activeMatchNavigatorIndex + 1} из ${matchNavigatorMatches.length}`;
            document.getElementById('match-navigator-level').textContent =
                `🎯 ${match.count}/${match.totalTokenCount}`;

            const chips = document.getElementById('match-navigator-chips');
            chips.replaceChildren(...match.tokens.map(token => {
                const chip = document.createElement('span');
                chip.className = 'match-navigator-chip';
                chip.textContent = token;
                return chip;
            }));

            document.getElementById('match-navigator').classList.toggle(
                'hidden',
                isMatchNavigatorMinimized
            );
            document.getElementById('match-navigator-minimized').classList.toggle(
                'hidden',
                !isMatchNavigatorMinimized
            );

            if (shouldScroll && match.elements[0]) {
                match.elements[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function moveMatchNavigator(direction) {
            if (matchNavigatorMatches.length === 0) return false;

            activeMatchNavigatorIndex =
                (activeMatchNavigatorIndex + direction + matchNavigatorMatches.length) %
                matchNavigatorMatches.length;
            updateMatchNavigator(true);
            return true;
        }

        function toggleMatchNavigator() {
            if (matchNavigatorMatches.length === 0) return;
            isMatchNavigatorMinimized = !isMatchNavigatorMinimized;
            updateMatchNavigator(false);
        }

        async function copyActiveMatchSentence() {
            const match = matchNavigatorMatches[activeMatchNavigatorIndex];
            if (!match) return;

            const text = match.elements
                .map(element => element.textContent || '')
                .join('')
                .replace(/\s+/g, ' ')
                .trim();
            if (!text) return;

            let copied = false;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    copied = true;
                }
            } catch (error) {
                copied = false;
            }

            if (!copied) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.setAttribute('readonly', '');
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                copied = document.execCommand('copy');
                textarea.remove();
            }

            const button = document.getElementById('match-navigator-copy');
            const label = copied ? '✓ Скопировано' : 'Не удалось';
            button.textContent = label;
            setTimeout(() => { button.textContent = '📋 Скопировать'; }, 1400);
        }

        function unwrapTemporaryElement(wrapper, parentsToNormalize) {
            const parent = wrapper.parentNode;
            if (!parent) return;

            while (wrapper.firstChild) parent.insertBefore(wrapper.firstChild, wrapper);
            parent.removeChild(wrapper);
            parentsToNormalize.add(parent);
        }

        function clearTemporaryHighlights(root = document) {
            const parentsToNormalize = new Set();

            root.querySelectorAll('mark.temp-highlight').forEach(mark => {
                unwrapTemporaryElement(mark, parentsToNormalize);
            });
            root.querySelectorAll('span.context-highlight[data-temp-context="1"]').forEach(context => {
                unwrapTemporaryElement(context, parentsToNormalize);
            });

            parentsToNormalize.forEach(parent => parent.normalize());
            hideMatchNavigator();
        }

        document.addEventListener('mousedown', function(e) {
            if (e.target.closest('.search-result')) return;
            if (e.target.closest('#search-input')) return;
            if (e.target.closest('#match-navigator, #match-navigator-minimized')) return;
            clearTemporaryHighlights();
        });

        // --- УПРАВЛЕНИЕ ИЗОБРАЖЕНИЯМИ ---
        let activeImage = null;
        let isResizing = false;
        let resizeStartX = 0;
        let resizeStartWidth = 0;

        function selectImage(img) { activeImage = img; updateImageOverlay(); }
        function hideImageControls() { activeImage = null; document.getElementById('image-overlay').classList.add('hidden'); document.getElementById('image-panel').classList.add('hidden'); }

        function updateImageOverlay() {
            if (!activeImage) return;
            const overlay = document.getElementById('image-overlay');
            const panel = document.getElementById('image-panel');
            const editorWrapper = document.getElementById('editor-wrapper');
            const imgRect = activeImage.getBoundingClientRect();
            const wrapRect = editorWrapper.getBoundingClientRect();
            
            const top = imgRect.top - wrapRect.top;
            const left = imgRect.left - wrapRect.left;
            const w = imgRect.width;
            const h = imgRect.height;
            
            overlay.style.top = top + 'px'; overlay.style.left = left + 'px';
            overlay.style.width = w + 'px'; overlay.style.height = h + 'px';
            overlay.classList.remove('hidden');

            panel.classList.remove('hidden');
            const panelW = panel.offsetWidth || 280; const panelH = panel.offsetHeight || 40;

            let panelTop = top - panelH - 10;
            if (panelTop < 0) panelTop = top + h + 10;
            
            let panelLeft = left;
            if (panelLeft + panelW > wrapRect.width) panelLeft = wrapRect.width - panelW - 10; 
            if (panelLeft < 0) panelLeft = 10;

            panel.style.top = panelTop + 'px'; panel.style.left = panelLeft + 'px';
            document.getElementById('img-width-input').value = Math.round(w);
        }

        document.getElementById('edit-body').addEventListener('mousedown', function(e) {
            if (e.target.tagName === 'IMG') selectImage(e.target); else hideImageControls();
        });
        document.getElementById('edit-body').addEventListener('input', hideImageControls);
        
        document.getElementById('overlay-handle').addEventListener('mousedown', function(e) {
            isResizing = true; resizeStartX = e.clientX; resizeStartWidth = activeImage.getBoundingClientRect().width;
            e.preventDefault(); e.stopPropagation();
        });
        document.addEventListener('mousemove', function(e) {
            if (!isResizing || !activeImage) return;
            let diff = e.clientX - resizeStartX; let newWidth = resizeStartWidth + diff;
            const maxW = document.getElementById('edit-body').clientWidth - 40;
            if (newWidth > maxW) newWidth = maxW; if (newWidth < 50) newWidth = 50;
            activeImage.style.width = newWidth + 'px'; updateImageOverlay();
        });
        document.addEventListener('mouseup', function() { if (isResizing) isResizing = false; });

        function applyImageWidthManual() {
            if (!activeImage) return;
            let w = parseInt(document.getElementById('img-width-input').value);
            if (w > 50) { activeImage.style.width = w + 'px'; updateImageOverlay(); }
        }

        function setImgAlign(align) {
            if (!activeImage) return;
            const wrapper = activeImage.closest('.image-container');
            if (!wrapper) return;
            
            if (align === 'left') { wrapper.style.float = 'left'; wrapper.style.margin = '10px 20px 10px 0'; } 
            else if (align === 'right') { wrapper.style.float = 'right'; wrapper.style.margin = '10px 0 10px 20px'; } 
            else { wrapper.style.float = 'none'; wrapper.style.margin = '15px auto'; }
            wrapper.style.display = 'block'; wrapper.style.width = 'fit-content';
            updateImageOverlay();
        }

        function moveImage(direction) {
            if (!activeImage) return;
            const wrapper = activeImage.closest('.image-container');
            if (!wrapper) return;
            if (direction === 'up' && wrapper.previousElementSibling) {
                wrapper.parentNode.insertBefore(wrapper, wrapper.previousElementSibling); updateImageOverlay();
            } else if (direction === 'down' && wrapper.nextElementSibling) {
                wrapper.parentNode.insertBefore(wrapper, wrapper.nextElementSibling.nextSibling); updateImageOverlay();
            }
        }

        function replaceActiveImage(event) {
            const file = event.target.files[0];
            if (!file || !activeImage) return;
            const reader = new FileReader();
            reader.onload = function(e) { activeImage.src = e.target.result; activeImage.onload = updateImageOverlay; };
            reader.readAsDataURL(file); event.target.value = ''; 
        }

        function deleteActiveImage() {
            if (activeImage) {
                const wrapper = activeImage.closest('.image-container');
                if (wrapper) wrapper.remove(); else activeImage.remove();
                hideImageControls();
            }
        }

        function insertImageAtCursor(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Str = e.target.result; const editorBody = document.getElementById('edit-body');
                editorBody.focus();
                if (savedCaretRange) { const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(savedCaretRange); }
                const imgId = 'img-' + Date.now();
                const htmlStr = `<div class="image-container" contenteditable="false" style="float: none; margin: 15px auto; width: fit-content; display: block;"><img id="${imgId}" src="${base64Str}" style="width: 500px; max-width: 100%; height: auto; display: block;"></div><p><br></p>`;
                document.execCommand('insertHTML', false, htmlStr);
                setTimeout(() => { const newImg = document.getElementById(imgId); if (newImg) { newImg.removeAttribute('id'); selectImage(newImg); } }, 50);
                event.target.value = '';
            };
            reader.readAsDataURL(file);
        }

        // --- ГОРЯЧИЕ КЛАВИШИ ---
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'k' || e.key === 'л' || e.key === 'K')) { e.preventDefault(); document.getElementById('search-input').focus(); }
            if (e.ctrlKey && (e.key === 's' || e.key === 'ы' || e.key === 'S')) {
                if (!document.getElementById('view-editor').classList.contains('hidden')) { e.preventDefault(); saveEdit(); }
            }
            if (e.altKey && e.key === 'ArrowDown' && moveMatchNavigator(1)) e.preventDefault();
            if (e.altKey && e.key === 'ArrowUp' && moveMatchNavigator(-1)) e.preventDefault();
            if (e.key === 'Escape') { closeMoveModal(); hideImageControls(); }
        });

        // --- ОСТАЛЬНАЯ ЛОГИКА ---
        function findNodeAndPath(nodes, id, currentPath = []) {
            for (let node of nodes) {
                const newPath = [...currentPath, {id: node.id, title: node.title, type: node.type}];
                if (node.id === id) return { node, path: newPath };
                if (node.children) {
                    const result = findNodeAndPath(node.children, id, newPath);
                    if (result) return result;
                }
            }
            return null;
        }

        function renderSidebarTree() {
            const container = document.getElementById('tree-container'); container.innerHTML = '';
            db.items.forEach(item => container.appendChild(createSidebarNode(item)));
        }

        function createSidebarNode(node) {
            const el = document.createElement('div'); el.className = 'tree-node';
            const item = document.createElement('div'); item.className = 'tree-item';
            let icon = node.type === 'company' ? '🏢' : (node.type === 'folder' ? '📁' : '📄');
            item.innerHTML = `<span>${icon}</span> <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${node.title}</span>`;
            item.onclick = (e) => {
                e.stopPropagation();
                if (node.children) { const c = el.querySelector('.tree-children'); if (c) c.classList.toggle('open'); }
                openNode(node.id);
            };
            el.appendChild(item);
            if (node.children && node.type !== 'article') {
                const childrenContainer = document.createElement('div'); childrenContainer.className = 'tree-children';
                node.children.forEach(child => childrenContainer.appendChild(createSidebarNode(child)));
                el.appendChild(childrenContainer);
            }
            return el;
        }

        function hideAllViews() {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-search').classList.add('hidden');
            document.getElementById('view-folder').classList.add('hidden');
            document.getElementById('view-article').classList.add('hidden');
            document.getElementById('view-editor').classList.add('hidden');
            hideImageControls();
            hideMatchNavigator();
        }

        function renderBreadcrumbs(containerId, pathData) {
            const bc = document.getElementById(containerId);
            bc.innerHTML = '<span onclick="goHome()">FAQ</span>';
            pathData.forEach((p, index) => {
                bc.innerHTML += ` / `;
                if (index === pathData.length - 1) bc.innerHTML += `<span class="current">${p.title}</span>`;
                else bc.innerHTML += `<span onclick="openNode('${p.id}')">${p.title}</span>`;
            });
        }

        function goHome() {
            if (window.innerWidth <= 768) toggleSidebar(false);

            searchReturnState = null;
            articleOpenedFromSearch = false;
            setSearchBackButtonVisible(false);

            clearTemporaryHighlights(); 
            currentNodeId = null;
            updateSearchScopeContext();
            hideAllViews();
            document.getElementById('view-home').classList.remove('hidden');
            
            const grid = document.getElementById('home-companies-grid'); grid.innerHTML = '';
            db.items.forEach(comp => {
                const card = document.createElement('div'); card.className = 'card'; card.onclick = () => openNode(comp.id);
                card.innerHTML = `<div class="card-icon" style="color: var(--primary);">🏢</div>
                                  <div class="card-title">${comp.title}</div>
                                  <div class="card-type">Компания</div>
                                  <div class="card-date">${formatLastModified(comp.lastModified)}</div>`;
                grid.appendChild(card);
            });
            if (isEditMode) {
                const addCard = document.createElement('div'); addCard.className = 'card'; addCard.style.borderStyle = 'dashed'; addCard.style.alignItems = 'center'; addCard.style.justifyContent = 'center'; addCard.onclick = () => startCreateNode('company', true);
                addCard.innerHTML = `<div class="card-title" style="color:var(--primary);">+ Создать компанию</div>`;
                grid.appendChild(addCard);
            }
        }

        function openNode(id, options = {}) {
            if (window.innerWidth <= 768) toggleSidebar(false);

            articleOpenedFromSearch = options.fromSearch === true;
            setSearchBackButtonVisible(false);

            clearTemporaryHighlights(); 
            
            currentNodeId = id;
            updateSearchScopeContext();
            const data = findNodeAndPath(db.items, id);
            if (!data) return;

            hideAllViews();
            document.querySelectorAll('.editor-only').forEach(el => el.classList.toggle('hidden', !isEditMode));

            if (data.node.type === 'company' || data.node.type === 'folder') {
                const view = document.getElementById('view-folder');
                view.classList.remove('hidden');
                renderBreadcrumbs('folder-breadcrumbs', data.path);
                document.getElementById('folder-title').innerText = data.node.title;
                document.getElementById('folder-last-modified').innerText = formatLastModified(data.node.lastModified);
                
                const grid = document.getElementById('folder-children-grid'); grid.innerHTML = '';
                const emptyState = document.getElementById('folder-empty-state');
                
                if (!data.node.children || data.node.children.length === 0) emptyState.classList.remove('hidden');
                else {
                    emptyState.classList.add('hidden');
                    data.node.children.forEach(child => {
                        const card = document.createElement('div'); card.className = 'card'; card.onclick = () => openNode(child.id);
                        const isFolder = child.type === 'folder';
                        card.innerHTML = `<div class="card-icon" style="color: ${isFolder ? 'var(--folder-color)' : 'var(--article-color)'};">${isFolder ? '📁' : '📄'}</div>
                                          <div class="card-title">${child.title}</div>
                                          <div class="card-type">${isFolder ? 'Раздел' : 'Статья'}</div>
                                          <div class="card-date">${formatLastModified(child.lastModified)}</div>`;
                        grid.appendChild(card);
                    });
                }
            } else if (data.node.type === 'article') {
                const view = document.getElementById('view-article');
                view.classList.remove('hidden');
                setSearchBackButtonVisible(
                    articleOpenedFromSearch && Boolean(searchReturnState)
                );
                renderBreadcrumbs('article-breadcrumbs', data.path);
                document.getElementById('article-title').innerText = data.node.title;
                document.getElementById('article-last-modified').innerText = formatLastModified(data.node.lastModified);
                
                const articleBodyEl = document.getElementById('article-body');
                articleBodyEl.innerHTML = migrateContent(data.node.content || '');
                bindImageErrorHandlers(articleBodyEl);
                
                const kwContainer = document.getElementById('article-keywords');
                if (data.node.keywords) { kwContainer.innerText = 'Ключевые слова: ' + data.node.keywords; kwContainer.classList.remove('hidden'); }
                else kwContainer.classList.add('hidden');

                if (activeHighlightQuery) {
                    const scrollTarget = applyTemporaryHighlight(
                        articleBodyEl,
                        activeHighlightQuery
                    );

                    activeHighlightQuery = null;

                    setTimeout(() => {
                        if (scrollTarget && scrollTarget.isConnected) {
                            scrollTarget.scrollIntoView({
                                behavior: 'smooth',
                                block: 'center'
                            });
                        }
                    }, 100);
                }
            }
        }

        function updateSearchScopeContext(scopeId = currentNodeId) {
            currentSearchScopeId = scopeId; 
            const indicator = document.getElementById('scope-indicator');
            const globalBtn = document.getElementById('global-search-btn');
            if (currentSearchScopeId) {
                const data = findNodeAndPath(db.items, currentSearchScopeId);
                indicator.innerText = `Ищем внутри: ${data.node.title}`;
                indicator.classList.remove('hidden'); globalBtn.classList.remove('hidden');
            } else { indicator.classList.add('hidden'); globalBtn.classList.add('hidden'); }
        }

        function resetSearchScope() {
            clearTemporaryHighlights();
            currentNodeId = null; updateSearchScopeContext();
            document.getElementById('search-input').value = '';
            document.getElementById('search-input').focus();
            goHome();
        }

        function debounceSearch() { clearTimeout(searchTimeout); searchTimeout = setTimeout(handleSearch, 150); }

        function compareRelevanceProfiles(left, right) {
            const leftVector = left.relevanceProfile.profileVector || [
                ...left.relevanceProfile.rankingProfile,
                left.relevanceProfile.totalMatches
            ];
            const rightVector = right.relevanceProfile.profileVector || [
                ...right.relevanceProfile.rankingProfile,
                right.relevanceProfile.totalMatches
            ];
            const maxLength = Math.max(
                leftVector.length,
                rightVector.length
            );

            for (let index = 0; index < maxLength; index += 1) {
                const difference = (rightVector[index] || 0) - (leftVector[index] || 0);
                if (difference !== 0) return difference;
            }

            return right.score - left.score;
        }

        function handleSearch() {
            const rawQuery = document.getElementById('search-input').value;
            const query = rawQuery.trim();
            const queryLower = query.toLowerCase();
            
            if (!queryLower) {
                searchReturnState = null;
                articleOpenedFromSearch = false;
                setSearchBackButtonVisible(false);

                if (currentNodeId) openNode(currentNodeId); else goHome();
                return;
            }

            hideAllViews();
            document.getElementById('view-search').classList.remove('hidden');

            let targetNodes = db.items;
            if (currentSearchScopeId) {
                const scopeData = findNodeAndPath(db.items, currentSearchScopeId);
                if (scopeData) targetNodes = [scopeData.node];
            }

            const results = [];
            const searchTerms = getSearchTokens(query);

            function searchRecursive(nodes, currentPath) {
                for (let node of nodes) {
                    const newPath = [...currentPath, {id: node.id, title: node.title, type: node.type}];
                    let score = 0;
                    let matchedContent = "";
                    
                    const titleLower = node.title.normalize('NFC').toLowerCase();
                    const keywordsLower = (node.keywords || "").normalize('NFC').toLowerCase();
                    const pathLower = newPath.map(p => p.title).join(" ").normalize('NFC').toLowerCase();
                    const articleProfile = node.type === 'article'
                        ? getArticleRelevanceProfile(node.content || '', query)
                        : null;
                    const articleText = articleProfile
                        ? articleProfile.text
                        : '';
                    
                    let matchesAll = true;
                    
                    for (let termIndex = 0; termIndex < searchTerms.length; termIndex += 1) {
                        const term = searchTerms[termIndex];
                        let termMatched = false;
                        
                        const regex = createSearchTermRegex(term, 'iu');

                        if (regex.test(titleLower)) { score += 10; termMatched = true; }
                        if (regex.test(keywordsLower)) { score += 8; termMatched = true; }
                        if (regex.test(pathLower)) { score += 5; termMatched = true; }
                        
                        if (node.type === 'article') {
                            const match = articleProfile.matches.find(
                                contentMatch => contentMatch.tokenIndex === termIndex
                            );
                            
                            if (match) {
                                score += 2;
                                termMatched = true;
                                
                                if (!matchedContent) {
                                    const snippetIdx = match.start;
                                    const start = Math.max(0, snippetIdx - 50);
                                    const end = Math.min(articleText.length, snippetIdx + 80);
                                    matchedContent = articleText.substring(start, end) + "...";
                                }
                            }
                        }

                        if (!termMatched) {
                            matchesAll = false;
                            break; 
                        }
                    }

                    if (searchTerms.length > 0 && matchesAll) {
                        
                        if (matchedContent) {
                            searchTerms.forEach(term => {
                                const regex = createSearchTermRegex(term, 'giu');
                                matchedContent = matchedContent.replace(regex, '<mark>$&</mark>');
                            });
                        }

                        let typeLabel = 'СТАТЬЯ';
                        let badgeClass = 'badge-article';
                        
                        if (node.type === 'folder') {
                            typeLabel = 'РАЗДЕЛ'; badgeClass = 'badge-folder';
                            matchedContent = matchedContent || "Найдено совпадение в разделе.";
                        } else if (node.type === 'company') {
                            typeLabel = 'КОМПАНИЯ'; badgeClass = 'badge-company';
                            matchedContent = matchedContent || "Найдено совпадение в названии компании.";
                        }
                        
                        results.push({ 
                            node: node, 
                            path: newPath, 
                            score: score, 
                            relevanceProfile: articleProfile
                                ? {
                                    rankingProfile: articleProfile.rankingProfile,
                                    profileVector: articleProfile.profileVector,
                                    totalMatches: articleProfile.totalMatches
                                }
                                : { rankingProfile: [], profileVector: [0], totalMatches: 0 },
                            preview: matchedContent || "Совпадение в названии или тегах...",
                            typeLabel: typeLabel,
                            badgeClass: badgeClass
                        });
                    }
                    
                    if (node.children) searchRecursive(node.children, newPath);
                }
            }

            searchRecursive(targetNodes, []);
            results.sort(compareRelevanceProfiles);

            searchReturnState = {
                inputValue: rawQuery,
                scopeId: currentSearchScopeId,
                results
            };

            renderSearchResults(results);
        }

        function setSearchBackButtonVisible(visible) {
            document.getElementById('back-to-search-btn')
                .classList.toggle('hidden', !visible);
        }

        function openSearchResult(nodeId) {
            if (!searchReturnState) return;

            activeHighlightQuery = searchReturnState.inputValue.trim();
            openNode(nodeId, { fromSearch: true });
        }

        function renderSearchResults(results) {
            const container = document.getElementById('search-results-container');
            container.innerHTML = '';
            document.getElementById('search-stats').innerText =
                `Найдено результатов: ${results.length}`;

            results.forEach(res => {
                const el = document.createElement('div');
                el.className = 'search-result';
                el.onclick = () => openSearchResult(res.node.id);

                const pathStr = res.path.map(p => p.title).join(' → ');

                el.innerHTML = `
                    <div class="res-header">
                        <div class="res-path">${pathStr}</div>
                        <span class="type-badge ${res.badgeClass}">${res.typeLabel}</span>
                    </div>
                    <div class="res-title">${res.node.title}</div>
                    <div class="res-preview">${res.preview}</div>
                `;

                container.appendChild(el);
            });
        }

        function returnToSearchResults() {
            const state = searchReturnState;
            if (!state) {
                goHome();
                return;
            }

            clearTemporaryHighlights();
            activeHighlightQuery = null;
            articleOpenedFromSearch = false;
            setSearchBackButtonVisible(false);

            currentNodeId = state.scopeId;
            document.getElementById('search-input').value = state.inputValue;

            hideAllViews();
            document.getElementById('view-search').classList.remove('hidden');
            updateSearchScopeContext(state.scopeId);
            renderSearchResults(state.results);
        }

        function toggleEditMode() {
            clearTemporaryHighlights();
            isEditMode = !isEditMode;
            const btn = document.getElementById('edit-mode-btn');
            btn.innerHTML = isEditMode ? '✅ Завершить ред.' : '✏️ Ред.';
            btn.classList.toggle('btn-danger', isEditMode);
            if (currentNodeId) openNode(currentNodeId); else goHome();
        }

        function startCreateNode(type, isRoot = false) {
            editingNodeId = null; editingParentId = isRoot ? null : currentNodeId; newNodeType = type;
            hideAllViews();
            const view = document.getElementById('view-editor'); view.classList.remove('hidden');
            document.getElementById('editor-header').innerText = type === 'company' ? 'Новая компания' : (type === 'folder' ? 'Новый раздел' : 'Новая статья');
            document.getElementById('edit-title').value = '';
            const isArticle = type === 'article';
            document.getElementById('editor-article-fields').classList.toggle('hidden', !isArticle);
            if (isArticle) { document.getElementById('edit-body').innerHTML = ''; document.getElementById('edit-keywords').value = ''; }
        }

        function editCurrentArticle() {
            clearTemporaryHighlights(); 
            const data = findNodeAndPath(db.items, currentNodeId);
            if (!data) return;
            editingNodeId = data.node.id; editingParentId = data.path.length > 1 ? data.path[data.path.length - 2].id : null; newNodeType = data.node.type;
            
            hideAllViews();
            document.getElementById('view-editor').classList.remove('hidden');
            document.getElementById('editor-header').innerText = 'Редактирование статьи';
            document.getElementById('edit-title').value = data.node.title;
            document.getElementById('editor-article-fields').classList.remove('hidden');
            document.getElementById('edit-body').innerHTML = migrateContent(data.node.content || '');
            bindImageErrorHandlers(document.getElementById('edit-body'));
            document.getElementById('edit-keywords').value = data.node.keywords || '';
        }

        function startRenameNode() {
            const data = findNodeAndPath(db.items, currentNodeId); if (!data) return;
            const newTitle = prompt('Введите новое название:', data.node.title);
            if (newTitle && newTitle.trim()) { 
                data.node.title = newTitle.trim();
                
                // Переименование — это тоже изменение, поэтому обновляем дату
                const ts = Date.now();
                updateAncestorsTimestamp(db.items, data.node.id, ts);
                
                saveToDB().then(() => { renderSidebarTree(); openNode(currentNodeId); }); 
            }
        }

        async function saveEdit() {
            const title = document.getElementById('edit-title').value.trim();
            if (!title) { alert('Название не может быть пустым!'); return; }

            const nodeData = { id: editingNodeId || generateId(), title: title, type: newNodeType };
            
            // Фиксируем момент УСПЕШНОГО сохранения
            const ts = Date.now();
            nodeData.lastModified = ts;

            if (newNodeType === 'article') {
                const bodyEl = document.getElementById('edit-body');
                const temp = document.createElement('div'); temp.innerHTML = migrateContent(bodyEl.innerHTML);
                const imgs = temp.querySelectorAll('img');
                imgs.forEach(img => { img.removeAttribute('id'); const wrapper = img.closest('.image-container'); if (wrapper) wrapper.removeAttribute('id'); });
                nodeData.content = temp.innerHTML;
                nodeData.keywords = document.getElementById('edit-keywords').value.trim();
            } else {
                nodeData.children = [];
                if (editingNodeId) { const oldData = findNodeAndPath(db.items, editingNodeId); if (oldData) nodeData.children = oldData.node.children || []; }
            }

            if (editingNodeId) {
                const parentArr = editingParentId ? findNodeAndPath(db.items, editingParentId).node.children : db.items;
                const index = parentArr.findIndex(n => n.id === editingNodeId);
                if (index !== -1) parentArr[index] = nodeData;
            } else {
                if (editingParentId) { const parent = findNodeAndPath(db.items, editingParentId).node; if (!parent.children) parent.children = []; parent.children.push(nodeData); }
                else db.items.push(nodeData);
            }

            // Прогоняем дату вверх по древу к родительским разделам и компании
            updateAncestorsTimestamp(db.items, nodeData.id, ts);

            await saveToDB();
            renderSidebarTree(); openNode(nodeData.id);
        }

        function cancelEdit() { hideImageControls(); if (editingNodeId) openNode(editingNodeId); else if (editingParentId) openNode(editingParentId); else goHome(); }

        function deleteCurrentNode() {
            if (!confirm('Вы уверены, что хотите удалить этот элемент? Это действие нельзя отменить!')) return;
            const data = findNodeAndPath(db.items, currentNodeId); if (!data) return;
            const parentArr = data.path.length > 1 ? findNodeAndPath(db.items, data.path[data.path.length - 2].id).node.children : db.items;
            const index = parentArr.findIndex(n => n.id === currentNodeId);
            if (index !== -1) { parentArr.splice(index, 1); saveToDB().then(() => { renderSidebarTree(); if (data.path.length > 1) openNode(data.path[data.path.length - 2].id); else goHome(); }); }
        }

        // --- МОДАЛЬНОЕ ОКНО ПЕРЕМЕЩЕНИЯ ---
        let moveTargetId = null;
        function openMoveModal() { moveTargetId = currentNodeId; renderMoveTree(); document.getElementById('move-modal').classList.remove('hidden'); }
        function closeMoveModal() { document.getElementById('move-modal').classList.add('hidden'); moveTargetId = null; }

        function renderMoveTree() {
            const container = document.getElementById('move-tree'); container.innerHTML = '';
            
            const rootItem = document.createElement('div'); rootItem.className = 'modal-item'; rootItem.innerText = '🏠 В корень (Главная)';
            rootItem.onclick = () => performMove(null); container.appendChild(rootItem);

            function buildTree(nodes, indent = 0) {
                nodes.forEach(node => {
                    if (node.type === 'article' || node.id === moveTargetId) return;
                    const el = document.createElement('div'); el.className = 'modal-item';
                    el.style.paddingLeft = (indent * 20 + 8) + 'px';
                    el.innerText = (node.type === 'company' ? '🏢 ' : '📁 ') + node.title;
                    el.onclick = () => performMove(node.id);
                    container.appendChild(el);
                    if (node.children) buildTree(node.children, indent + 1);
                });
            }
            buildTree(db.items);
        }

        async function performMove(newParentId) {
            if (newParentId === moveTargetId) { alert("Нельзя переместить папку саму в себя!"); return; }
            const data = findNodeAndPath(db.items, moveTargetId); if (!data) return;
            
            const oldParentArr = data.path.length > 1 ? findNodeAndPath(db.items, data.path[data.path.length - 2].id).node.children : db.items;
            const index = oldParentArr.findIndex(n => n.id === moveTargetId);
            if (index === -1) return;

            const nodeToMove = oldParentArr.splice(index, 1)[0];

            if (newParentId === null) db.items.push(nodeToMove);
            else { const newParent = findNodeAndPath(db.items, newParentId).node; if (!newParent.children) newParent.children = []; newParent.children.push(nodeToMove); }

            await saveToDB();
            closeMoveModal(); renderSidebarTree(); openNode(moveTargetId);
        }

        // --- ИМПОРТ / ЭКСПОРТ ---
        function exportDB() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const dlAnchorElem = document.createElement('a'); dlAnchorElem.setAttribute("href", dataStr); dlAnchorElem.setAttribute("download", "faq_backup.json"); dlAnchorElem.click();
        }

        function importDB(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && imported.items) { db = imported; await saveToDB(); renderSidebarTree(); goHome(); alert('База успешно импортирована!'); } 
                    else alert('Неверный формат файла!');
                } catch (err) { alert('Ошибка чтения файла!'); }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        window.onload = initStorage;

    </script>
</body>
